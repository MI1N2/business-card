<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김민희 · Online Business Card</title>
  <style>
    :root {
      --bg-top: #0b0e1a;
      --bg-bottom: #101527;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.09);
      --text-primary: #eef1fa;
      --text-secondary: #9aa3c0;
      --text-muted: #6b7394;
      --accent-1: #6366f1;
      --accent-2: #22d3ee;
      --accent-3: #a78bfa;
      --danger: #f87171;
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
        "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      overflow: hidden;
      position: relative;
    }

    /* Decorative background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      top: -120px;
      left: -100px;
      background: radial-gradient(circle, var(--accent-1), transparent 70%);
    }

    .orb-2 {
      width: 460px;
      height: 460px;
      bottom: -160px;
      right: -120px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      opacity: 0.32;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      top: 40%;
      right: 12%;
      background: radial-gradient(circle, var(--accent-3), transparent 70%);
      opacity: 0.2;
    }

    /* Subtle grid overlay */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 44px 36px 38px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      animation: fadeUp 0.7s ease both;
    }

    /* Top accent line */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 3px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Avatar frame: wraps the photo so decorative pseudo-elements render */
    .frame {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      box-shadow:
        0 0 16px rgba(34, 211, 238, 0.7),
        0 0 32px rgba(99, 102, 241, 0.45),
        0 0 60px rgba(34, 211, 238, 0.2),
        0 12px 28px rgba(0, 0, 0, 0.4),
        inset 0 0 12px rgba(34, 211, 238, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      user-select: none;
    }

    /* Photo frame border glows with a bright arc rotating clockwise */
    .frame::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      padding: 5px;
      background: conic-gradient(
        from 0deg,
        rgba(34, 211, 238, 0) 0deg,
        rgba(34, 211, 238, 0.75) 55deg,
        #22d3ee 90deg,
        #6366f1 125deg,
        rgba(167, 139, 250, 0.6) 155deg,
        rgba(167, 139, 250, 0) 195deg
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      filter: blur(1px);
      animation: spin 2.6s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Cascading per-letter glow for the one-line intro (M -> 희, ONE light passes through) */
    .cg {
      display: inline-block;
      animation: charGlow 4.8s linear infinite;
    }

    @keyframes charGlow {
      0%, 95.9% {
        color: #636b8c;
        text-shadow: none;
      }
      96%, 100% {
        color: #ffffff;
        text-shadow:
          0 0 10px var(--accent-2),
          0 0 22px var(--accent-2),
          0 0 36px var(--accent-1);
      }
    }

    .name {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .name-roman {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    /* Affiliation badges */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .badge-team {
      color: var(--accent-2);
      border-color: rgba(34, 211, 238, 0.35);
      background: rgba(34, 211, 238, 0.08);
    }

    .badge-process {
      color: var(--accent-3);
      border-color: rgba(167, 139, 250, 0.35);
      background: rgba(167, 139, 250, 0.08);
    }

    .divider {
      width: 56px;
      height: 1px;
      margin: 0 auto 20px;
      background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    }

    /* One-line intro */
    .intro {
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 26px;
      min-height: 3.4rem;
    }

    /* Email button */
    .email-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #0b0e1a;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      text-decoration: none;
      box-shadow: 0 10px 26px rgba(34, 211, 238, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      word-break: break-all;
    }

    .email-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(34, 211, 238, 0.4);
    }

    .email-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }


    /* Responsive tweaks for small screens */
    @media (max-width: 400px) {
      .card {
        padding: 36px 24px 32px;
      }

      .name {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="card">
    <div class="frame">
      <img class="avatar" src="profile.jpg" alt="김민희 프로필" />
    </div>

    <h1 class="name">김민희</h1>
    <p class="name-roman">Kim Min Hee</p>

    <div class="badges">
      <span class="badge badge-team">P4-2P/J팀</span>
      <span class="badge badge-process">INSPECTION</span>
    </div>

    <div class="divider"></div>

    <p class="intro">
      <span class="cg" style="animation-delay:0s">M</span><span class="cg" style="animation-delay:0.2s">I</span><span class="cg" style="animation-delay:0.4s">&nbsp;</span><span class="cg" style="animation-delay:0.6s">간</span><span class="cg" style="animation-delay:0.8s">판</span><span class="cg" style="animation-delay:1s">,</span><span class="cg" style="animation-delay:1.2s">&nbsp;</span><span class="cg" style="animation-delay:1.4s">I</span><span class="cg" style="animation-delay:1.6s">N</span><span class="cg" style="animation-delay:1.8s">S</span><span class="cg" style="animation-delay:2s">P</span><span class="cg" style="animation-delay:2.2s">E</span><span class="cg" style="animation-delay:2.4s">C</span><span class="cg" style="animation-delay:2.6s">T</span><span class="cg" style="animation-delay:2.8s">I</span><span class="cg" style="animation-delay:3s">O</span><span class="cg" style="animation-delay:3.2s">N</span><span class="cg" style="animation-delay:3.4s">의</span><span class="cg" style="animation-delay:3.6s">&nbsp;</span><span class="cg" style="animation-delay:3.8s">빛</span><span class="cg" style="animation-delay:4s">&nbsp;</span><span class="cg" style="animation-delay:4.2s">김</span><span class="cg" style="animation-delay:4.4s">민</span><span class="cg" style="animation-delay:4.6s">희</span>
    </p>

    <a class="email-btn" href="mailto:minheeee.kim@samsung.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2" />
        <path d="m22 7-10 6L2 7" />
      </svg>
      minheeee.kim@samsung.com
    </a>

  </main>
</body>
</html>
